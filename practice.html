<!DOCTYPE html>

<html lang="en">

<head>
	<link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
	<meta charset="utf-8">
	<title>Wyltl Playground</title>
	<script src="./wasm/wasm_exec.js"></script>
	<link rel="stylesheet" href="./static/test.css">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="The Web Assembly based Wyltl Interpreter and Compiler">
</head>

<body>

	<div class="container">

		<section>
			<br />
			<br />
			<h1 style="text-align: center;">Welcome to the Wyltl Playground!</h1>
		</section>

		<section>
			<br />
			<nav>
				<a href="./index.html"><button>Home</button></a>
				<a href="./introduction.html"><button>Introduction</button></a>
				<a href="./specification.html"><button>Specification</button></a>
				<a href="./download.html"><button>Download</button></a>
			</nav>
		</section>

		<section>
			<br />
		<select id="exampleSelector">
			<option value="">Select an example...</option>
			<option value="bellmanFord.wyltl">Bellman Ford</option>
			<option value="binarySearch.wyltl">Binary Search</option>
			<option value="breadthFirstSearch.wyltl">Breadth First Search</option>
			<option value="bubbleSort.wyltl">Bubble Sort</option>
			<option value="depthFirstSearch.wyltl">Depth First Search</option>
			<option value="dijkstraSearch.wyltl">Dijkstra's Algorithm</option>
			<option value="fibonacci.wyltl">Fibonacci</option>
			<option value="greatestCommonDivisor.wyltl">Greatest Common Divisor</option>
			<option value="insertionSort.wyltl">Insertion Sort</option>
			<option value="iterativeFibonacci.wyltl">Iterative Fibonacci</option>
			<option value="knuthMorrisPratt.wyltl">Knuth Morris Pratt</option>
			<option value="mergeSort.wyltl">Merge Sort</option>
			<option value="modularExponentiation.wyltl">Modular Exponentiation</option>
			<option value="palindrome.wyltl">Palindrome</option>
			<option value="prims.wyltl">Prims</option>
			<option value="greeter.wyltl">Greeter</option>
			<option value="quickSort.wyltl">Quick Sort</option>
			<option value="recursion.wyltl">Recursion</option>
			<option value="selectionSort.wyltl">Selection Sort</option>
			<option value="javaScriptInteroperability.wyltl">JavaScript Interoperability</option>
		</select>
		</section>

		<section>
			<br />
			<br />
			<textarea id="input" placeholder="Enter your Wyltl code here..." style="overflow-y:hidden"></textarea>
		</section>

		<section>
			<br />
			<br />
			<navWithCorners>
				<button class=buttonrev id="tokenize">Tokenize</button>
				<button class=buttonrev id="parse">Parse</button>
				<button class=buttonrev id="run">Interpret</button>
				<!-- <button class=buttonrev id="compile" >Compile</button> -->
				<button class=buttonrev id="vm">Compile & Virtual Machine</button>
			</navWithCorners>
		</section>

		<section>
			<br />
			<br />
			<textarea id="output" readonly placeholder="The output will appear here..."></textarea>
		</section>

		<section>
			<br />
			<br />
			<h1 style="text-align: center;">Created by Dineth Mallawarachchi</h1>
		</section>

		<script>

			document.getElementById("exampleSelector").addEventListener("change", function () {
				const filename = this.value;
				if (filename) {
					fetch(`./wyltlCode/${filename}`)
						.then(response => response.text())
						.then(code => {
							document.getElementById("input").value = code;
							autoResizeTextArea(document.getElementById("input"));
						})
						.catch(error => console.error("Error loading example:", error));
				}
			});


			function autoResizeTextArea(textarea) {
				textarea.style.height = "auto";
				textarea.style.height = textarea.scrollHeight + "px";
			}

			document.addEventListener("input", function (event) {
				if (event.target.tagName === "TEXTAREA") {
					autoResizeTextArea(event.target);
				}
			});

			function updateTextAreaContent(textarea, newContent) {
				textarea.value = newContent;
				autoResizeTextArea(textarea);
			}

			if (!WebAssembly.instantiateStreaming) {
				WebAssembly.instantiateStreaming = async (resp, importObject) => {
					const source = await (await resp).arrayBuffer();
					return await WebAssembly.instantiate(source, importObject);
				};
			}

			function formatExecutionTime(startTime) {
				const endTime = performance.now();
				const executionTime = endTime - startTime;
				return `[Execution time: ${executionTime.toFixed(2)}ms]`;
			}

			const go = new Go();
			WebAssembly.instantiateStreaming(fetch("./wasm/main.wasm"), go.importObject)
				.then((result) => {
					go.run(result.instance);

					document.getElementById("run").onclick = function () {
						const startTime = performance.now();
						const code = document.getElementById("input").value;
						document.getElementById("output").value = "";
						const result = interpretWyltl(code);
						if (result) {
							document.getElementById("output").value += result + "\n";
						}
						document.getElementById("output").value += formatExecutionTime(startTime) + "\n";
					};

					document.getElementById("tokenize").onclick = function () {
						const startTime = performance.now();
						const code = document.getElementById("input").value;
						document.getElementById("output").value = "";
						const result = tokenizeWyltl(code);
						if (result) {
							try {
								const tokens = JSON.parse(result);
								const formatted = tokens.map(token =>
									`Type: ${token.type}, Literal: "${token.literal}"`
								).join('\n');
								document.getElementById("output").value += formatted + "\n";
							} catch (e) {
								document.getElementById("output").value += result + "\n";
							}
						}
						document.getElementById("output").value += formatExecutionTime(startTime) + "\n";
					};

					document.getElementById("parse").onclick = function () {
						const startTime = performance.now();
						const code = document.getElementById("input").value;
						document.getElementById("output").value = "";
						const result = parseWyltl(code);
						if (result) {
							document.getElementById("output").value += result + "\n";
						}
						document.getElementById("output").value += formatExecutionTime(startTime) + "\n";
					};

					/* 					
					document.getElementById("compile").onclick = function () {
						const startTime = performance.now();
						const code = document.getElementById("input").value;
						document.getElementById("output").value = "";
						const result = compileWyltl(code);
						if (result) {
							document.getElementById("output").value += result + "\n";
						}
						document.getElementById("output").value += formatExecutionTime(startTime) + "\n";
					}; */

					document.getElementById("vm").onclick = function () {
						const startTime = performance.now();
						const code = document.getElementById("input").value;
						document.getElementById("output").value = "";
						const result = runVirtualMachine(code);
						if (result) {
							document.getElementById("output").value += result + "\n";
						}
						document.getElementById("output").value += formatExecutionTime(startTime) + "\n";
					};
				})
				.catch((err) => {
					console.error('Failed to load WASM:', err);
					document.getElementById("output").value = "Failed to load WASM: " + err;
				});

			const originalConsoleLog = console.log;
			console.log = function () {
				const output = document.getElementById("output");
				output.value += Array.from(arguments).join(" ") + "\n";
				originalConsoleLog.apply(console, arguments);
			};

		function getUrlParameter(name) {
			name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
			const regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
			const results = regex.exec(location.search);
			return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
		}

		function loadExampleFile(filename) {
			if (filename) {
				fetch(`./wyltlCode/${filename}`)
					.then(response => response.text())
					.then(code => {
						updateTextAreaContent(document.getElementById("input"), code);
						
						const selectElement = document.getElementById("exampleSelector");
						for (let i = 0; i < selectElement.options.length; i++) {
							if (selectElement.options[i].value === filename) {
								selectElement.selectedIndex = i;
								break;
							}
						}
					})
					.catch(error => console.error("Error loading example:", error));
			}
		}

		document.addEventListener("DOMContentLoaded", function() {
			const fileParam = getUrlParameter('file');
			if (fileParam) {
				loadExampleFile(fileParam);
			}
		});

		</script>

	</div>

</body>

</html>
